services:
  - type: web
    name: zjj-smart-emergency-api
    runtime: python
    rootDir: Xfplus
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FALLBACK_LLM_TYPE
        value: mock
